<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ZYNIQ Studio is an AI-driven software factory and innovation lab. We don't just adapt to the future, we engineer it." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ZYNIQ Studio | AI-Driven Software Factory</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static copy of the consultation form so Netlify Forms detects it at build time. -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

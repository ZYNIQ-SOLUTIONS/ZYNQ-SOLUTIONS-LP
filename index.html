  <body>
    <div id="root"></div>
    <!-- Static copy of the consultation form so Netlify Forms detects it at build time. -->
    <form name="consultation" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="firstName" />
      <input type="text" name="lastName" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
